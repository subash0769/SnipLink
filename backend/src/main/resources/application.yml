server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: url-shortener-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80}
